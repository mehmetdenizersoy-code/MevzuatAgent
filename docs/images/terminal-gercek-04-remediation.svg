    <text x="30" y="112" fill="#e2e8f0" xml:space="preserve">Yukarıdaki tarama bulgularını ve Markdown/HTML raporlarını incelediniz mi? Onayınızla remediation önerisi hazırlansın </text>
    <text x="30" y="134" fill="#e2e8f0" xml:space="preserve">   mı? [e/H]: e</text>
    <text x="30" y="156" fill="#e2e8f0" xml:space="preserve">Ollama en önemli iki bulgu için değişiklik önerisi hazırlıyor.</text>
    <text x="30" y="178" fill="#e2e8f0" xml:space="preserve">qwen3:4b geçerli öneri üretmedi; gemma3:4b modeli deneniyor.</text>
    <text x="30" y="200" fill="#e2e8f0" xml:space="preserve">Düzeltme önerisini üreten model: gemma3:4b</text>
    <text x="30" y="222" fill="#e2e8f0" xml:space="preserve">--- a/payment_rules.py</text>
    <text x="30" y="244" fill="#e2e8f0" xml:space="preserve">+++ b/payment_rules.py</text>
    <text x="30" y="266" fill="#e2e8f0" xml:space="preserve">@@ -23,9 +23,9 @@</text>
    <text x="30" y="288" fill="#e2e8f0" xml:space="preserve"> </text>
    <text x="30" y="310" fill="#e2e8f0" xml:space="preserve"> def installment_amount(total: float, count: int) -&gt; float:</text>
    <text x="30" y="332" fill="#e2e8f0" xml:space="preserve">     """Tek taksit tutarını döndürür."""</text>
    <text x="30" y="354" fill="#fca5a5" xml:space="preserve">-    return total</text>
    <text x="30" y="376" fill="#86efac" xml:space="preserve">+    return (total * 1.08) / count</text>
    <text x="30" y="398" fill="#e2e8f0" xml:space="preserve"> </text>
    <text x="30" y="420" fill="#e2e8f0" xml:space="preserve"> </text>
    <text x="30" y="442" fill="#e2e8f0" xml:space="preserve"> def normalize_name(name: str) -&gt; str:</text>
    <text x="30" y="464" fill="#e2e8f0" xml:space="preserve">     """İsim alanını düzenler."""</text>
    <text x="30" y="486" fill="#fca5a5" xml:space="preserve">-    return name</text>
    <text x="30" y="508" fill="#86efac" xml:space="preserve">+    return name</text>
