<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1640" viewBox="0 0 1480 1640" role="img" aria-labelledby="title description">
  <title id="title">MevzuatAgent tarama öncesi süre tahmini terminal çıktısı</title>
  <desc id="description">Kullanıcının paylaştığı terminal metninden hazırlanmış terminal görünümü. Tarama, model seçimi ve onay sonrasında başlatılmayı bekliyor.</desc>
  <rect width="1480" height="1640" fill="#10151d"/>
  <rect x="0" y="0" width="1480" height="48" rx="14" fill="#252c36"/>
  <rect x="0" y="34" width="1480" height="14" fill="#252c36"/>
  <circle cx="26" cy="24" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="24" r="7" fill="#febc2e"/>
  <circle cx="74" cy="24" r="7" fill="#28c840"/>
  <text x="740" y="30" text-anchor="middle" fill="#d6dbe2" font-family="Arial, sans-serif" font-size="15">Terminal — MevzuatAgent</text>
  <text x="30" y="77" fill="#8391a3" font-family="Arial, sans-serif" font-size="13">Paylaşılan terminal metninden oluşturulmuş görünüm · Tarama sonucu henüz oluşmadı</text>
  <g fill="#e2e8f0" font-family="Menlo, Monaco, Consolas, monospace" font-size="15">
    <text x="30" y="112"><tspan fill="#7dd3fc">(.venv) (base) denizersoy@192 Final-Proje_MevzuatAgent %</tspan> cd ~/PycharmProjects/Final-Proje_MevzuatAgent</text>
    <text x="30" y="136"><tspan fill="#7dd3fc">(.venv) (base) denizersoy@192 Final-Proje_MevzuatAgent %</tspan> .venv/bin/mevzuat-agent</text>
    <text x="30" y="184" fill="#a7f3d0">Merhaba! Ben MevzuatAgent. Seçtiğiniz mevzuat ve Git depolarını inceleyip</text>
    <text x="30" y="208" fill="#a7f3d0">kanıta dayalı tarama raporları oluşturmaya yardımcı olurum.</text>
    <text x="30" y="256">MevzuatAgent | Mevzuat uyumluluğu kod tarama aracı</text>
    <text x="30" y="280">Raporlar otomatik karar değildir; mevzuat uzmanı tarafından doğrulanmalıdır.</text>
    <text x="30" y="328" fill="#fbbf24">Mevzuat bağlantıları:</text>
    <text x="30" y="352">  1. https://www.mevzuat.gov.tr/MevzuatMetin/1.5.5464.pdf</text>
    <text x="30" y="376">  2. https://www.mevzuat.gov.tr/File/GeneratePdf?mevzuatNo=11180&amp;mevzuatTur=KurumVeKurulusYonetmeligi&amp;mevzuatTertip=5</text>
    <text x="30" y="400">Yeni mevzuat bağlantısı eklemek ister misiniz? [e/H]: h</text>
    <text x="30" y="448" fill="#fbbf24">Git depo bağlantıları:</text>
    <text x="30" y="472">  1. https://github.com/mehmetdenizersoy-code/demo2.git</text>
    <text x="30" y="496">  2. https://github.com/mehmetdenizersoy-code/demo1</text>
    <text x="30" y="520">  3. https://github.com/mehmetdenizersoy-code/mevzuatagent-test-fixtures</text>
    <text x="30" y="544">Yeni depo bağlantısı eklemek ister misiniz? [e/H]: h</text>
    <text x="30" y="592">Önceden indirilen mevzuat/RAG verisini, eski tarama ve varsayılan remediation</text>
    <text x="30" y="616">raporlarını, temiz yerel klonları silip baştan hazırlayayım mı? [e/H]: e</text>
    <text x="30" y="664" fill="#fbbf24">Temizlenecek önceki veriler:</text>
    <text x="30" y="688">- data/legislation/downloads</text>
    <text x="30" y="712">- data/legislation/rag</text>
    <text x="30" y="736">- data/reports/scans</text>
    <text x="30" y="760">- data/repositories/demo1</text>
    <text x="30" y="784">- data/repositories/demo2</text>
    <text x="30" y="808">- data/repositories/mevzuatagent-test-fixtures</text>
    <text x="30" y="856" fill="#a7f3d0">Önceki indirme, RAG/chunk, rapor ve yerel depo verileri temizlendi.</text>
    <text x="30" y="880">Temiz başlangıç hazır. Mevzuat kapsamını seçip 'devam' yazın; indirme,</text>
    <text x="30" y="904">RAG hazırlama ve depo klonlama sıfırdan yapılacak.</text>
    <text x="30" y="952" fill="#fbbf24">Mevzuat seçenekleri:</text>
    <text x="30" y="976">  1. 1.5.5464.pdf</text>
    <text x="30" y="1000">  2. GeneratePdf</text>
    <text x="30" y="1024">Numara, virgülle ayrılmış numaralar veya * (tümü) yazın.</text>
    <text x="30" y="1072"><tspan fill="#7dd3fc">Siz:</tspan> *</text>
    <text x="30" y="1096">Mevzuat kapsamı seçildi: tüm kaynaklar. Ne yapmak istersiniz?</text>
    <text x="30" y="1144"><tspan fill="#7dd3fc">Siz:</tspan> devam</text>
    <text x="30" y="1168">Pipeline adımı: Mevzuat belgelerini indirip RAG indeksini hazırlama</text>
    <text x="30" y="1192">İndirildi: data/legislation/downloads/001_1.5.5464.pdf</text>
    <text x="30" y="1216">İndirildi: data/legislation/downloads/002_GeneratePdf</text>
    <text x="30" y="1240">RAG indeksi hazır: data/legislation/rag/chunks.jsonl (146 parça)</text>
    <text x="30" y="1288"><tspan fill="#7dd3fc">Siz:</tspan> devam</text>
    <text x="30" y="1312">Pipeline adımı: repo_link.json depolarını temiz çalışma alanına klonlama</text>
    <text x="30" y="1336">Klonlandı: data/repositories/demo2</text>
    <text x="30" y="1360">Klonlandı: data/repositories/demo1</text>
    <text x="30" y="1384">Klonlandı: data/repositories/mevzuatagent-test-fixtures</text>
    <text x="30" y="1432" fill="#7dd3fc">Siz: 3. repoyu tara</text>
    <text x="30" y="1456">Depo numarası: 3</text>
    <text x="30" y="1480">Taranacak kaynak dosyası sayısı (1-2) [tümü: 2]: 2</text>
    <text x="30" y="1528" fill="#fbbf24">Model başına tahmini tarama süresi:</text>
    <text x="30" y="1552">1. llama3.2:1b — yaklaşık 66 saniye</text>
    <text x="30" y="1576">2. qwen3:4b — yaklaşık 148 saniye   ·   3. gemma3:4b — yaklaşık 167 saniye</text>
    <text x="30" y="1616" fill="#7dd3fc">Taramada kullanılacak model: qwen3:4b — kullanıcı onayı verildi; sonuç bekleniyor…</text>
  </g>
</svg>
