<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title description">
  <title id="title">MevzuatAgent başlangıç akışının temsili terminal görünümü</title>
  <desc id="description">Kullanıcının paylaştığı terminal metninden hazırlanmış örnek görünüm; birebir ekran görüntüsü değildir.</desc>
  <rect width="1400" height="700" rx="18" fill="#0b1220"/>
  <path d="M18 0h1364a18 18 0 0 1 18 18v48H0V18A18 18 0 0 1 18 0Z" fill="#172033"/>
  <circle cx="30" cy="33" r="7" fill="#ff5f57"/>
  <circle cx="54" cy="33" r="7" fill="#febc2e"/>
  <circle cx="78" cy="33" r="7" fill="#28c840"/>
  <text x="700" y="39" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">MevzuatAgent — terminal başlangıç akışı</text>
  <rect x="1132" y="17" width="240" height="32" rx="16" fill="#334155"/>
  <text x="1252" y="38" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TEMSİLİ GÖRÜNÜM</text>
  <g font-family="Menlo, Monaco, Consolas, monospace" font-size="15" xml:space="preserve">
    <text x="34" y="102" fill="#94a3b8">(.venv) (base) denizersoy@192 Final-Proje_MevzuatAgent % cd ~/PycharmProjects/Final-Proje_MevzuatAgent</text>
    <text x="34" y="130" fill="#86efac">.venv/bin/mevzuat-agent</text>
    <text x="34" y="172" fill="#7dd3fc">Merhaba! Ben MevzuatAgent. Seçtiğiniz mevzuat ve Git depolarını inceleyip kanıta dayalı tarama</text>
    <text x="34" y="197" fill="#7dd3fc">raporları oluşturmaya yardımcı olurum.</text>
    <text x="34" y="225" fill="#e2e8f0">MevzuatAgent | Mevzuat uyumluluğu kod tarama aracı</text>
    <text x="34" y="253" fill="#94a3b8">Raporlar otomatik karar değildir; mevzuat uzmanı tarafından doğrulanmalıdır.</text>
    <text x="34" y="295" fill="#fbbf24">Mevzuat bağlantıları:</text>
    <text x="34" y="323" fill="#cbd5e1">  1. https://www.mevzuat.gov.tr/MevzuatMetin/1.5.5464.pdf</text>
    <text x="34" y="351" fill="#cbd5e1">  2. https://www.mevzuat.gov.tr/File/GeneratePdf?mevzuatNo=11180&amp;mevzuatTur=KurumVeKurulusYonetmeligi&amp;mevzuatTertip=5</text>
    <text x="34" y="379" fill="#a5b4fc">Yeni mevzuat bağlantısı eklemek ister misiniz? [e/H]: <tspan fill="#f8fafc">h</tspan></text>
    <text x="34" y="421" fill="#fbbf24">Git depo bağlantıları:</text>
    <text x="34" y="449" fill="#cbd5e1">  1. https://github.com/mehmetdenizersoy-code/demo2.git</text>
    <text x="34" y="477" fill="#cbd5e1">  2. https://github.com/mehmetdenizersoy-code/demo1</text>
    <text x="34" y="505" fill="#a5b4fc">Yeni depo bağlantısı eklemek ister misiniz? [e/H]: <tspan fill="#f8fafc">e</tspan></text>
    <text x="34" y="533" fill="#a5b4fc">Depo URL'si (vazgeçmek için boş bırakın): <tspan fill="#f8fafc">https://github.com/mehmetdenizersoy-code/mevzuatagent-test-fixtures</tspan></text>
  </g>
  <path d="M34 562h1332" stroke="#263449"/>
  <text x="34" y="594" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Paylaşılan terminal çıktısından oluşturulmuş temsili görsel. Gerçek uygulama ekran görüntüsü değildir.</text>
</svg>
